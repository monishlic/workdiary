    h+='<div id="rem-form" style="display:none;margin-bottom:18px" class="set-sec"><label class="f-label">Reminder for '+esc(name)+'</label><textarea id="rem-msg" class="f-area" rows="2" placeholder="e.g. Please follow up on Raul Shah today"></textarea><div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary" data-action="raise-reminder" data-id="'+esc(staffId)+'">Send Reminder</button><button class="btn btn-ghost" data-action="cancel-reminder">Cancel</button></div></div>';
    h+='<div class="sec-title">Pending ('+pend.length+')</div><div class="task-list">';
    if(!pend.length) h+='<div class="empty" style="padding:26px"><div class="empty-t">Nothing pending 🎉</div></div>'; else pend.forEach(function(t){ h+=taskCardAdmin(t); });
    h+='</div><div style="height:22px"></div><div class="sec-title">Completed ('+done.length+')</div><div class="task-list">';
    if(!done.length) h+='<div class="empty" style="padding:26px"><div class="empty-t">Nothing completed yet</div></div>'; else done.forEach(function(t){ h+=taskCardAdmin(t); });
    h+='</div>';
    document.getElementById('content').innerHTML=h;
  }).catch(function(e){ showContentError_(e.message||'Could not load.'); });
}

/* Read-only card for admin viewing another person's work */
function taskCardStatic(t,isDone){
  var h='<div class="card'+(isDone?' done':'')+'" style="cursor:default">';
  h+='<div class="card-body"><div class="card-client">'+esc(t.clientName)+'</div>';
  var meta='Added '+fmtDate(t.createdTimestamp)+' · '+esc(t.department)+' › '+esc(t.category);
  if(isDone&&t.completedTimestamp) meta+=' → Completed '+fmtDate(t.completedTimestamp);
  h+='<div class="card-meta">'+meta+'</div>';
  if(t.details) h+='<div class="card-preview">'+esc(t.details)+'</div>';
  h+='</div>';
  if(isDone){ h+='<div class="card-right"><span class="done-badge">'+ico('check')+' Completed</span></div>'; }
  else { var d=daysSince(t.createdTimestamp); var cls=d<=2?'days-ok':d<=5?'days-warn':'days-urgent'; var lbl=d===0?'Today':d===1?'1 day':d+' days'; h+='<div class="card-right"><span class="days '+cls+'">'+lbl+'</span></div>'; }
  h+='</div>'; return h;
}
function submitReminder(staffId){
  var msg=(document.getElementById('rem-msg').value||'').trim();
  if(!msg){ toast('Type a reminder message.','error'); return; }
  apiCall('raiseReminder',{forUserId:staffId, message:msg}).then(function(res){
    if(!res||!res.ok){ toast(res&&res.error?res.error:'Could not send.','error'); return; }
    toast('🔔 Reminder sent','success');
    var f=document.getElementById('rem-form'); if(f)f.style.display='none';
    var m=document.getElementById('rem-msg'); if(m)m.value='';
  }).catch(function(e){ toast(e.message||'Could not send.','error'); });
}

/* ================================================================
   IN-APP REMINDERS (recipient)
   ================================================================ */
function loadReminders(){
  if(!Sync.online()) return Promise.resolve();
  return apiCall('getReminders',{}).then(function(res){
    if(!res||!res.ok) return;
    var list=res.reminders||[];
    if(App._notifInit){ list.forEach(function(r){ if(!r.read && !App._notifSeen[r.reminderId]) fireDesktopNotif(r); }); }
    var seen={}; list.forEach(function(r){ seen[r.reminderId]=true; });
    App._notifSeen=seen; App._notifInit=true;
    App.reminders=list; updateBell();
  }).catch(function(){});
}
function updateBell(){
  var badge=document.getElementById('bell-badge'); if(!badge) return;
  var unread=App.reminders.filter(function(r){ return !r.read; }).length;
  if(unread>0){ badge.style.display='block'; badge.textContent=unread>9?'9+':String(unread); } else { badge.style.display='none'; }
}
function notifIcon(type){ return type==='assignment'?'📌':(type==='completed'?'✅':(type==='comment'?'💬':'🔔')); }
function openReminders(){
  var body=document.getElementById('reminders-body');
  if(!App.reminders.length){ body.innerHTML='<div class="empty" style="padding:30px"><div class="empty-ico">🔔</div><div class="empty-t">No notifications</div><div class="empty-s">You\'re all caught up.</div></div>'; }
  else {
    body.innerHTML=App.reminders.map(function(r){
      var clk = r.taskUid ? ' data-action="notif-open" data-uid="'+esc(r.taskUid)+'" style="cursor:pointer"' : '';
      return '<div class="rem-item'+(r.read?' read':'')+'"'+clk+'><div class="rem-top"><span class="rem-from">'+notifIcon(r.type)+' '+esc(r.fromName)+'</span><span class="rem-time">'+esc(r.created)+'</span></div><div class="rem-msg">'+esc(r.message)+'</div>'+(r.read?'':'<button class="btn btn-ghost btn-sm" data-action="mark-reminder" data-id="'+esc(r.reminderId)+'" style="margin-top:9px">Mark as read</button>')+'</div>';
    }).join('');
  }
  openModal('reminders-modal');
}
function markReminderRead(id){
  apiCall('markReminderRead',{reminderId:id}).then(function(res){
    if(res&&res.ok){ App.reminders.forEach(function(r){ if(r.reminderId===id) r.read=true; }); updateBell(); openReminders(); }
  }).catch(function(){});
}

/* ================================================================
   STAGE 2 — Assignment, shared tasks, comments, desktop notifs
   ================================================================ */
function loadTeamMembers(){
  if(!Sync.online()) return Promise.resolve();
  return apiCall('teamMembers',{}).then(function(res){ if(res&&res.ok) App.members=res.members||[]; }).catch(function(){});
}
function openAssign(){
  if(!Sync.online()){ toast('Assigning needs an internet connection.','warn'); return; }
  var go=function(){
    var sel=document.getElementById('assign-to');
    var opts=App.members.filter(function(m){ return m.userId!==App.identity.employeeId; });
    if(!opts.length){ toast('No teammates found yet.','warn'); }
    sel.innerHTML=opts.map(function(m){ return '<option value="'+esc(m.userId)+'">'+esc(m.name)+' ('+esc(m.role)+')</option>'; }).join('');
    document.getElementById('assign-dept').value=''; document.getElementById('assign-cat').value='';
    document.getElementById('assign-client').value=''; document.getElementById('assign-details').value='';
    var b=document.getElementById('assign-submit'); b.disabled=false; b.textContent='Assign';
    hideSuggs(); openModal('assign-modal');
    setTimeout(function(){ document.getElementById('assign-client').focus(); },120);
  };
  if(App.members.length) go(); else loadTeamMembers().then(go);
}
function submitAssign(){
  var to=document.getElementById('assign-to').value;
  var dept=(document.getElementById('assign-dept').value||'').trim();
  var cat=(document.getElementById('assign-cat').value||'').trim();
  var client=(document.getElementById('assign-client').value||'').trim();
  var details=(document.getElementById('assign-details').value||'').trim();
  if(!to){ toast('Pick who to assign to.','error'); return; }
  if(!dept||!cat){ toast('Choose a department and category.','error'); return; }
  if(!client){ toast('Client name is required.','error'); return; }
  var b=document.getElementById('assign-submit'); b.disabled=true; b.innerHTML='<span class="mini-spin"></span> Assigning…';
  ensureDeptCat(dept,cat).then(function(n){
    return apiCall('assignTask',{ assigneeId:to, department:n.dept, category:n.cat, clientName:client, details:details });
  }).then(function(res){
    if(!res||!res.ok) throw new Error(res&&res.error?res.error:'Assign failed');
    closeModal('assign-modal');
    var who=(App.members.find(function(m){return m.userId===to;})||{}).name||'teammate';
    toast('✓ Assigned '+client+' to '+who,'success');
    if(App.view==='assigned') renderAssignedByMe();
  }).catch(function(e){ b.disabled=false; b.textContent='Assign'; toast('Could not assign. '+(e.message||''),'error'); });
}

function renderAssignedByMe(){
  App.view='assigned'; buildSidebar();
  document.getElementById('content').innerHTML='<div class="cat-head"><div class="cat-title">Assigned by Me</div><div class="cat-sub">Loading…</div></div>';
  if(!Sync.online()){ showContentError_('This view needs an internet connection.'); return; }
  apiCall('getAssignedByMe',{}).then(function(res){
    if(!res||!res.ok){ showContentError_(res&&res.error?res.error:'Could not load.'); return; }
    var tasks=res.tasks||[]; App._sharedCache={}; tasks.forEach(function(t){ App._sharedCache[t.uid]=t; });
    var pend=tasks.filter(function(t){return t.status!=='Completed';});
    var done=tasks.filter(function(t){return t.status==='Completed';});
    var h='<div class="cat-head"><div class="cat-title">Assigned by Me</div><div class="cat-sub">'+tasks.length+' task'+(tasks.length!==1?'s':'')+' you gave to others</div>';
    h+='<div class="cat-actions"><button class="add-btn" data-action="open-assign">'+plusIco()+'Assign a Task</button></div></div>';
    h+='<div class="sec-title">Outstanding ('+pend.length+')</div><div class="task-list">';
    if(!pend.length) h+='<div class="empty" style="padding:24px"><div class="empty-t">Nothing outstanding 🎉</div></div>'; else pend.forEach(function(t){ h+=sharedCard(t); });
    h+='</div><div style="height:20px"></div><div class="sec-title">Completed ('+done.length+')</div><div class="task-list">';
    if(!done.length) h+='<div class="empty" style="padding:24px"><div class="empty-t">None completed yet</div></div>'; else done.forEach(function(t){ h+=sharedCard(t); });
    h+='</div>';
    document.getElementById('content').innerHTML=h;
  }).catch(function(e){ showContentError_(e.message||'Could not load.'); });
}
function sharedCard(t){
  var isDone=t.status==='Completed';
  var h='<div class="card'+(isDone?' done':'')+'" data-action="open-shared" data-uid="'+esc(t.uid)+'">';
  h+='<div class="card-body"><div class="card-client">'+esc(t.clientName)+'</div>';
  h+='<div class="card-meta">To '+esc(t.ownerName)+' · '+esc(t.department)+' › '+esc(t.category)+(isDone&&t.completedTimestamp?' · Completed '+fmtDate(t.completedTimestamp):'')+'</div>';
  if(t.details) h+='<div class="card-preview">'+esc(t.details)+'</div>';
  h+='</div><div class="card-right"><span class="'+(isDone?'done-badge':'days days-warn')+'">'+(isDone?ico('check')+' Done':'⏳ '+esc(t.status))+'</span></div></div>';
  return h;
}
function openShared(uid){
  var t=(App._sharedCache||{})[uid]; if(!t){ toast('Task not found.','error'); return; }
  var isDone=t.status==='Completed';
  document.getElementById('det-title').textContent=t.clientName;
  var h='<div class="d-grid"><div class="d-row"><div class="d-lbl">Assigned to</div><div class="d-val">'+esc(t.ownerName)+'</div></div>';
  h+='<div class="d-row"><div class="d-lbl">Category</div><div class="d-val">'+esc(t.department)+' › '+esc(t.category)+'</div></div>';
  h+='<div class="d-row"><div class="d-lbl">Status</div><div class="d-val"><span class="d-status '+(isDone?'done':'pending')+'">'+(isDone?ico('check')+' Completed':'&#9679; '+esc(t.status))+'</span></div></div>';
  h+='<div class="d-row"><div class="d-lbl">Assigned</div><div class="d-val">'+esc(fmtDateTime(t.createdTimestamp))+'</div></div></div>';
  h+='<div class="d-row"><div class="d-lbl">Details</div><div class="d-val">'+(t.details?esc(t.details):'—')+'</div></div>';
  h+=commentsBlock(t.uid);
  document.getElementById('det-body').innerHTML=h;
  document.getElementById('det-foot').innerHTML='<button class="btn btn-primary" data-action="close-modal" data-modal="detail-modal">Close</button>';
  openModal('detail-modal'); loadCommentsInto(t.uid);
}

/* Comments */
function commentsBlock(uid){
  return '<div class="d-row"><div class="d-lbl">Comments</div><div id="comments-list" class="comments-list"><div class="c-muted">Loading…</div></div>'+
    '<div class="comment-add"><input type="text" id="comment-input" class="f-input" placeholder="Write a comment…" maxlength="500"><button class="btn btn-primary btn-sm" data-action="add-comment" data-uid="'+esc(uid)+'">Send</button></div></div>';
}
function loadCommentsInto(uid){
  var el=document.getElementById('comments-list'); if(!el) return;
  if(!Sync.online()){ el.innerHTML='<div class="c-muted">Comments need a connection.</div>'; return; }
  apiCall('getComments',{taskUid:uid}).then(function(res){
    var e2=document.getElementById('comments-list'); if(!e2) return;
    if(!res||!res.ok){ e2.innerHTML='<div class="c-muted" style="color:var(--danger)">Could not load comments.</div>'; return; }
    if(!res.comments.length){ e2.innerHTML='<div class="c-muted">No comments yet.</div>'; return; }
    e2.innerHTML=res.comments.map(function(c){ return '<div class="comment"><div class="comment-top"><span class="comment-author">'+esc(c.authorName)+'</span><span class="comment-time">'+esc(c.created)+'</span></div><div class="comment-text">'+esc(c.text)+'</div></div>'; }).join('');
  }).catch(function(){});
}
function addCommentUI(uid){
  var input=document.getElementById('comment-input'); if(!input) return;
  var text=(input.value||'').trim(); if(!text) return;
  input.disabled=true;
  apiCall('addComment',{taskUid:uid, text:text}).then(function(res){
    input.disabled=false;
    if(!res||!res.ok){ toast(res&&res.error?res.error:'Could not comment.','error'); return; }
    input.value=''; loadCommentsInto(uid);
  }).catch(function(e){ input.disabled=false; toast(e.message||'Could not comment.','error'); });
}

/* Admin acting on a staffer's task */
function taskCardAdmin(t){
  var isDone=t.status==='Completed';
  var h='<div class="card'+(isDone?' done':'')+'" style="cursor:default">';
  h+='<div class="card-body"><div class="card-client">'+esc(t.clientName)+'</div>';
  var meta='Added '+fmtDate(t.createdTimestamp)+' · '+esc(t.department)+' › '+esc(t.category);
  if(isDone&&t.completedTimestamp) meta+=' → Completed '+fmtDate(t.completedTimestamp);
  h+='<div class="card-meta">'+meta+'</div>';
  if(t.details) h+='<div class="card-preview">'+esc(t.details)+'</div>';
  h+='</div><div class="card-right">';
  if(isDone) h+='<button class="btn btn-ghost btn-sm" data-action="admin-act" data-uid="'+esc(t.uid)+'" data-status="Pending">Reopen</button>';
  else h+='<button class="complete-btn" data-action="admin-act" data-uid="'+esc(t.uid)+'" data-status="Completed">'+ico('check')+' Complete</button>';
  h+='</div></div>'; return h;
}
function adminAct(uid,status){
  apiCall('updateSharedTask',{uid:uid, status:status}).then(function(res){
    if(!res||!res.ok){ toast(res&&res.error?res.error:'Could not update.','error'); return; }
    toast(status==='Completed'?'✓ Completed (as Admin)':'Reopened','success');
    if(App._staffView) openStaff(App._staffView.id, App._staffView.name);
  }).catch(function(e){ toast(e.message||'Could not update.','error'); });
}

/* Desktop notifications */
function requestNotifPermission(){ try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){} }
function fireDesktopNotif(n){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    var title=n.type==='assignment'?'📌 New task assigned':(n.type==='completed'?'✅ Task completed':(n.type==='comment'?'💬 New comment':'🔔 Reminder'));
    var no=new Notification(title,{body:n.message});
    no.onclick=function(){ try{window.focus();}catch(e){} if(n.taskUid) openFromNotif(n.taskUid); no.close(); };
  }catch(e){}
}
function openFromNotif(uid){
  var t=App.tasks.find(function(x){return x.uid===uid;});
  if(t){ openTask(t.taskId); return; }
  navigate('dashboard'); toast('Open your diary to see it.','info');
}
function resetDiary(){
  if(!confirm('This will permanently erase this diary and all its tasks on this device. This cannot be undone.\n\nAre you sure?')) return;
  if(!confirm('Final confirmation: erase everything and start over?')) return;
  Promise.all([Store.clear('tasks'),Store.clear('activityLog'),Store.clear('kv'),Store.clear('syncQueue')])
    .then(function(){ toast('Diary reset','info'); setTimeout(function(){ location.reload(); },600); })
    .catch(function(e){ toast('Could not reset. '+(e.message||''),'error'); });
}
function exportData(){
  var payload={identity:App.identity,exportedAt:nowISO(),tasks:App.tasks};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob); var a=document.createElement('a');
  a.href=url; a.download='workdiary-backup-'+fmtDate(nowISO()).replace(/ /g,'-')+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000); toast('✓ Backup downloaded','success');
}

/* ================================================================
   MODAL / SIDEBAR HELPERS
   ================================================================ */
function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); if(id==='add-modal') hideSuggs(); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sb-ov').classList.remove('open'); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sb-ov').classList.toggle('open'); }

/* ================================================================
   EVENTS
   ================================================================ */
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-action]');
  // Hide combobox suggestions when clicking outside a combo
  if(!e.target.closest('.combo')) hideSuggs();
  if(!el) return;
  var a=el.getAttribute('data-action');
  switch(a){
    case 'do-login': doLogin(); break;
    case 'log-out': logout(); break;
    case 'open-reminders': openReminders(); break;
    case 'mark-reminder': markReminderRead(el.getAttribute('data-id')); break;
    case 'open-staff': openStaff(el.getAttribute('data-id'), el.getAttribute('data-name')); break;
    case 'open-reminder-form': var rf=document.getElementById('rem-form'); if(rf){ rf.style.display='block'; var rm=document.getElementById('rem-msg'); if(rm)rm.focus(); } break;
    case 'cancel-reminder': var rf2=document.getElementById('rem-form'); if(rf2)rf2.style.display='none'; break;
    case 'raise-reminder': submitReminder(el.getAttribute('data-id')); break;
    case 'open-assign': openAssign(); break;
    case 'submit-assign': submitAssign(); break;
    case 'open-shared': openShared(el.getAttribute('data-uid')); break;
    case 'add-comment': addCommentUI(el.getAttribute('data-uid')); break;
    case 'admin-act': adminAct(el.getAttribute('data-uid'), el.getAttribute('data-status')); break;
    case 'notif-open': closeModal('reminders-modal'); openFromNotif(el.getAttribute('data-uid')); break;
    case 'toggle-sidebar': toggleSidebar(); break;
    case 'toggle-dept': toggleDept(el.getAttribute('data-dept')); break;
    case 'nav': navigate(el.getAttribute('data-view'), el.getAttribute('data-dept'), el.getAttribute('data-cat')); break;
    case 'show-list': showList(el.getAttribute('data-filter')); break;
    case 'open-add': openAdd(el.getAttribute('data-dept'), el.getAttribute('data-cat')); break;
    case 'submit-add': submitAdd(); break;
    case 'close-modal': closeModal(el.getAttribute('data-modal')); break;
    case 'open-task': openTask(el.getAttribute('data-id')); break;
    case 'complete-task': completeTask(el.getAttribute('data-id'), el); break;
    case 'switch-tab': switchTab(el.getAttribute('data-tab')); break;
    case 'save-task': saveTask(el.getAttribute('data-id'), el); break;
    case 'complete-from-detail': completeTask(el.getAttribute('data-id'), el); break;
    case 'reopen-task': reopenTask(el.getAttribute('data-id')); break;
    case 'pick': pickSugg(el.getAttribute('data-input'), parseInt(el.getAttribute('data-idx'),10)); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'reset-diary': resetDiary(); break;
    case 'export-data': exportData(); break;
    case 'sync-now': syncNow(); break;
  }
});

document.addEventListener('input', function(e){
  if(!e.target)return;
  if(e.target.id==='search'){ if(App.view!=='search'){ App.view='search'; buildSidebar(); } renderSearch(e.target.value); }
  else if(e.target.classList && e.target.classList.contains('combo-input')){ suggestFor(e.target); }
});
document.addEventListener('focusin', function(e){
  if(e.target && e.target.classList && e.target.classList.contains('combo-input')) suggestFor(e.target);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal('add-modal'); closeModal('detail-modal'); closeModal('reminders-modal'); closeModal('assign-modal'); }
  if(e.key==='Enter'){
    var id=document.activeElement?document.activeElement.id:'';
    if(id==='add-client'){ submitAdd(); }
    else if(id==='assign-client'){ submitAssign(); }
    else if(id==='comment-input'){ var cb=document.querySelector('[data-action="add-comment"]'); if(cb) addCommentUI(cb.getAttribute('data-uid')); }
    else if(id==='login-key'||id==='login-url'){ doLogin(); }
    else if(id==='add-dept'||id==='add-cat'){ e.preventDefault(); if(id==='add-dept'){ document.getElementById('dept-sugg').classList.add('hidden'); document.getElementById('add-cat').focus(); } else { document.getElementById('cat-sugg').classList.add('hidden'); document.getElementById('add-client').focus(); } }
  }
});
</script>
